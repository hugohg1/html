<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: black;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
            color: darkred;
        }
        a:hover{
            color: red;
            text-decoration: underline;
        }
        a:active{
            color: blue;
        }
        a::after{
            content: " (link )";
            color: darkgray;
            font-weight: normal;
        }
        .link::after{
            content: " (link externo)";
            color: darkgray;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>personalizando links</h1>
    <ul>
        <li ><a href="https://www.facebook.com/hugo.henrique.251823/" target="_blank"
            >facebook</a></li>
        <li><a href="https://www.instagram.com/hugohenri0/" target="_blank" class="link">intagram</a></li>
        <li><a href="https://www.youtube.com/@Oguh.h" target="_blank">youtube</a></li>
    </ul>
</body>
</html>
