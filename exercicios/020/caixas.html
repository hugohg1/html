<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modelo de caixas</title>
    <style>
        
        
       h1 {
        background-color: #9c73a8;
        width: 380px;
        height: 50px;
        border: 5px groove #870f6e;
        padding: 10px; 
        margin: auto;
        }
       a {

        border: 5px groove #870f6e;
        background-color: #9c73a8;
       
       }
    </style>
</head>
<body>
    <h1>exemplo de caixa box-level</h1>
    <p>paragrafos tambem sao caixas box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>vamos ver como tudo isso funciona</p>
</body>
</html>
