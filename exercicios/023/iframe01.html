<head>

    <title>estudo do iframe</title>
    <style>
        iframe.grande{
            height: 400px;
            width: 400px;
            border: 2px solid black;
            
        }
    </style>
</head>
<body>

    <p>acessando o site do <a href="https://www.cursoemvideo.com/" target="_blank">CursoemVideo</a> para aprender a programar.</p>
    
    
    <p>acessando o site do
        <iframe class="grande" src="https://www.cursoemvideo.com/" frameborder="1">

        </iframe>
        
         para aprender a programar.</p>
